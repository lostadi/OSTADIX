name: Native runtime bundles

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - setup.sh
      - scripts/runtime_bundle.py
      - scripts/install_native_binaries.py
      - tests/test_runtime_bundle.py
      - tests/test_setup.py
      - .github/workflows/native-runtime-release.yml

permissions:
  contents: read

jobs:
  installer-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest -v tests.test_setup tests.test_native_install tests.test_runtime_bundle

  native:
    needs: installer-contract
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Build and execute native host artifacts
        run: python3 scripts/runtime_bundle.py build --output-dir "$RUNNER_TEMP/runtime-build"
      - name: Test MCP provenance and watcher boundaries on the native host
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cargo test --release --locked \
            --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml \
            --target "$EXPECTED_TARGET" --target-dir target/native-runtime-bundle/mcp \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/runtime-build/MCP-TEST.log"
      - name: Package, verify and independently relocate
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          from scripts.runtime_bundle import package, verify, install, digest
          build = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-build'
          manifest = json.loads((build / 'BUILD-MANIFEST.json').read_text())
          assert manifest['targetTriple'] == os.environ['EXPECTED_TARGET']
          short = manifest['source']['commit'][:12]
          prefix = 'ostadix-runtime-' + short + '-' + manifest['targetTriple']
          dist = pathlib.Path('dist'); dist.mkdir(exist_ok=True)
          archive = dist / (prefix + '.zip')
          package(build, archive)
          verify(archive, digest(archive), require_host=True)
          install(archive, pathlib.Path(os.environ['RUNNER_TEMP']) / 'relocated runtime',
                  pathlib.Path(os.environ['RUNNER_TEMP']) / 'installed bin', digest(archive))
          shutil.copyfile(build / 'BUILD-MANIFEST.json', dist / (prefix + '.build.json'))
          shutil.copyfile(build / 'SMOKE.json', dist / (prefix + '.smoke.json'))
          shutil.copyfile(build / 'MCP-TEST.log', dist / (prefix + '.tests.log'))
          if manifest['host']['system'] == 'linux':
              shutil.copyfile(build / 'SOURCE.zip', dist / ('Ostadix-lang-source-' + short + '.zip'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: native
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download both qualified native artifacts
        run: gh run download "$GITHUB_RUN_ID" --pattern 'native-runtime-*' --dir release-artifacts
      - name: Verify source identity and attach immutable assets
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          from scripts.runtime_bundle import verify, digest
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          root = pathlib.Path('release-artifacts')
          archives = sorted(root.glob('*/ostadix-runtime-*.zip'))
          assert len(archives) == 2
          targets = set()
          for path in archives:
              manifest = verify(path, digest(path))
              assert manifest['sourceCommit'] == commit
              targets.add(manifest['targetTriple'])
          assert targets == {'aarch64-unknown-linux-gnu', 'aarch64-apple-darwin'}
          files = sorted(str(p) for p in root.glob('*/*') if p.is_file())
          # Existing names cause failure; never silently overwrite a released asset.
          subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'], *files], check=True)
          PY
