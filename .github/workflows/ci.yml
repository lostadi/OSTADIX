  native-systems:
    name: Native Ethernet and real Linux integration
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install native and foreign-kernel build tools
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -qF packages.microsoft.com "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm qemu-system-x86 qemu-system-arm device-tree-compiler gcc-aarch64-linux-gnu libc6-dev-arm64-cross flex bison bc libssl-dev libelf-dev
      - name: Build the O-core compiler
        run: cargo build --locked --bin ocorec
      - name: Verify declared native integration runtimes
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite native-systems
      - name: Exercise native Ethernet execution and retry fences
        run: |
          bash ocore/kernel/native-cluster/build.sh
          python3 -m unittest -v tests.test_native_cluster_harness
          python3 ocore/kernel/native-cluster/verify.py target/ocore-native-cluster/kernel.elf target/ocore-native-cluster/evidence
      - name: Build pinned unmodified Linux and its static guest agent
        run: |
          bash scripts/build-real-linux-payload.sh
          OCORE_LINUX_GUEST_BUILD_DIR="$PWD/target/ocore-real-linux/payload" bash ocore/guest/linux/build-initramfs.sh
      - name: Exercise real Linux device withdrawal under O-core stage two
        run: |
          python3 -m unittest -v tests.test_kernel_world_real_linux
          OCORE_LINUX_PAYLOAD_DIR="$PWD/target/ocore-real-linux/payload" OCORE_LINUX_OCOREC_BIN="$PWD/target/debug/ocorec" bash ocore/kernel/build-aarch64-kernel-world-linux.sh
          python3 ocore/kernel/smoke-aarch64-kernel-world-linux-qemu.py --payload-dir target/ocore-real-linux/payload --build-dir target/ocore-real-linux/monitor --output-dir target/ocore-real-linux/evidence --timeout 120
      - name: Retain native transcripts and payload provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-systems-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ocore-native-cluster/evidence/
            target/ocore-real-linux/evidence/
            target/ocore-real-linux/payload/linux-payload.json
            target/ocore-real-linux/payload/linux.config
          if-no-files-found: warn
          retention-days: 14

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - c17
      - contracts
      - docker
      - mcp
      - native-systems
      - ocore-qemu
      - offline-kit
      - python
      - release-claims
      - rust-hosted
      - rust-msrv
      - rust-quality
      - rust-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent evidence lane
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          RUST_MSRV: ${{ needs.rust-msrv.result }}
          RUST_QUALITY: ${{ needs.rust-quality.result }}
          RUST_TESTS: ${{ needs.rust-tests.result }}
          RUST_HOSTED: ${{ needs.rust-hosted.result }}
          PYTHON: ${{ needs.python.result }}
          C17: ${{ needs.c17.result }}
          DOCKER: ${{ needs.docker.result }}
          MCP: ${{ needs.mcp.result }}
          OFFLINE_KIT: ${{ needs.offline-kit.result }}
          RELEASE_CLAIMS: ${{ needs.release-claims.result }}
          OCORE_QEMU: ${{ needs.ocore-qemu.result }}
          NATIVE_SYSTEMS: ${{ needs.native-systems.result }}
        run: |
          status=0
          for name in CONTRACTS RUST_MSRV RUST_QUALITY RUST_TESTS RUST_HOSTED PYTHON C17 DOCKER MCP OFFLINE_KIT RELEASE_CLAIMS OCORE_QEMU NATIVE_SYSTEMS; do
            result="${!name}"
            printf '%s=%s\n' "$name" "$result"
            [[ "$result" == success ]] || status=1
          done
          exit "$status"

  release-package:
    name: Release source package
    needs: required-ci
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build and verify release source
        run: |
          python3 scripts/build_source_release.py --output "$RUNNER_TEMP/Ostadix-lang-source.zip"
          python3 scripts/build_source_release.py --verify "$RUNNER_TEMP/Ostadix-lang-source.zip"
      - name: Upload verified source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ostadix-lang-source-${{ github.sha }}
          path: ${{ runner.temp }}/Ostadix-lang-source.zip
          if-no-files-found: error
