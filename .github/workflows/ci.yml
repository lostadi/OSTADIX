name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Contract surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate publication metadata
        env:
          ATTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ATTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/check_commit_authors.py
          --base "$ATTRIBUTION_BASE"
          --head "$ATTRIBUTION_HEAD"
          --ref-type "${{ github.ref_type || 'branch' }}"
      - name: Validate authoritative contract projections
        run: |
          python3 scripts/local_ci_posture.py --profile baseline --format text
          python3 scripts/contract_surfaces.py validate
          python3 scripts/check_architecture_boundaries.py
          python3 -m unittest -v tests.test_contract_surfaces tests.test_local_ci_posture tests.test_commit_authors tests.test_architecture_boundaries tests.test_governance_surfaces tests.test_ci_nix_profile
      - name: Verify required LLVM provisioning and refusal controls
        run: |
          python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_prepare_ci_llvm_profile")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun < 29 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit("required LLVM archive/refusal controls must execute with no skips")
          PY
      - name: Verify reviewed embedded-provider source closure
        run: |
          python3 -B - <<'PYCODE'
          # Required embedded-provider source closure controller: no LLVM execution.
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_ocore_provider_group_source_closure")
          discovered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (not result.wasSuccessful() or discovered != 5 or result.testsRun != 5 or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("all5 embedded-provider source closure tests must execute without skips")
          PYCODE
      - name: Verify complete-source inventory worker and recipe bindings
        run: |
          python3 - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tools/ocore-runtime/libc", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun < 17 or result.skipped:
              raise SystemExit("complete-source inventory regressions must execute without skips")
          PY

      - name: Verify capture-only original assembly action evidence
        run: |
          python3 -B - <<'PYCONTROLS'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_ocore_runtime_capture_assembly_action")
          if suite.countTestCases() != 33:
              raise SystemExit("all33 capture-only assembly action controls are required")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 33 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit("capture-only assembly action controls must all execute without skips")
          PYCONTROLS

      - name: Verify generic original archive source origin fixtures
        run: |
          python3 -B - <<'PYARCHIVE'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_ocore_original_archive_origin")
          if suite.countTestCases() != 16:
              raise SystemExit("all16 original archive origin controls are required")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 16 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit("original archive origin controls must all execute without skips")
          PYARCHIVE

  ocore-constrained-fp:
    name: Required original-source constrained FP
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize required FP evidence
        run: |
          mkdir -p target/ocore-constrained-fp
          git rev-parse HEAD > target/ocore-constrained-fp/source-commit.txt
          git status --porcelain > target/ocore-constrained-fp/source-status.txt
          test ! -s target/ocore-constrained-fp/source-status.txt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install declared Linux-host build and supplied-tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential make git python3 xz-utils libxml2 zlib1g
          python3 scripts/contract_surfaces.py probe-runtimes --suite ocore-constrained-fp
      - name: Authenticate and stream the exact minimal LLVM release
        run: |
          set -euo pipefail
          rust_sysroot="$(rustc +1.97.1 --print sysroot)"
          python3 - <<'PYCODE'
          import json, pathlib, subprocess
          root = pathlib.Path(subprocess.check_output(["rustc", "+1.97.1", "--print", "sysroot"], text=True).strip())
          libraries = sorted((root / "lib").glob("libLLVM.so.22.1-rust-1.97.1-*"))
          selection = {"status": "passed" if len(libraries) == 1 else "failed",
                       "candidates": [str(path) for path in libraries],
                       "required": "Rust1.97.1 x86-64 Linux LLVM22.1.6 C API"}
          pathlib.Path("target/ocore-constrained-fp/parser-selection.json").write_text(json.dumps(selection, indent=2) + "\n")
          if len(libraries) != 1:
              raise SystemExit("required exact Rust1.97.1 parser library is missing or ambiguous")
          pathlib.Path("target/ocore-constrained-fp/parser-path.txt").write_text(str(libraries[0]) + "\n")
          PYCODE
          parser_library="$(cat target/ocore-constrained-fp/parser-path.txt)"
          python3 -B scripts/prepare_ci_llvm_profile.py \
            --archive "$RUNNER_TEMP/LLVM-22.1.6-Linux-X64.tar.xz" \
            --prefix "$RUNNER_TEMP/llvm22-constrained-fp" \
            --output "$GITHUB_WORKSPACE/target/ocore-constrained-fp/setup" \
            --rustc "$rust_sysroot/bin/rustc" --parser-library "$parser_library" \
            2>&1 | tee target/ocore-constrained-fp/provision.log
      - name: Capture clean original musl and freeze the newly built compiler
        run: |
          set -euo pipefail
          git clone https://git.musl-libc.org/git/musl "$RUNNER_TEMP/musl-constrained-fp" 2>&1 | tee target/ocore-constrained-fp/musl-clone.log
          git -C "$RUNNER_TEMP/musl-constrained-fp" checkout --detach 0784374d561435f7c787a555aeab8ede699ed298
          test -z "$(git -C "$RUNNER_TEMP/musl-constrained-fp" status --porcelain)"
          git -C "$RUNNER_TEMP/musl-constrained-fp" rev-parse HEAD > target/ocore-constrained-fp/musl-commit.txt
          git -C "$RUNNER_TEMP/musl-constrained-fp" ls-tree -r --full-tree HEAD > target/ocore-constrained-fp/musl-source-tree.txt
          git -C "$RUNNER_TEMP/musl-constrained-fp" archive --format=tar --output "$GITHUB_WORKSPACE/target/ocore-constrained-fp/original-musl-source.tar" HEAD
          sha256sum target/ocore-constrained-fp/original-musl-source.tar > target/ocore-constrained-fp/original-musl-source.sha256
          cargo +1.97.1 build --locked --bin ocorec 2>&1 | tee target/ocore-constrained-fp/compiler-build.log
          cp target/debug/ocorec target/ocore-constrained-fp/ocorec-frozen
          chmod 0555 target/ocore-constrained-fp/ocorec-frozen
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          path = root / "target/ocore-constrained-fp/ocorec-frozen"
          record = {"path": str(path), "bytes": path.stat().st_size,
                    "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                    "source_commit": (root / "target/ocore-constrained-fp/source-commit.txt").read_text().strip()}
          (path.parent / "compiler-pin.json").write_text(json.dumps(record, indent=2) + "\n")
          PYCODE
      - name: Execute both required original-source scalar FP suites
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' 2>&1 | tee target/ocore-constrained-fp/tests.log
          import hashlib, json, os, pathlib, unittest
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / "target/ocore-constrained-fp"
          environment = json.loads((evidence / "setup/environment.json").read_text())
          compiler = json.loads((evidence / "compiler-pin.json").read_text())
          environment.update(OCOREC_BIN=compiler["path"], OCOREC_BIN_SHA256=compiler["sha256"],
                             OCORE_MUSL_SOURCE=str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "musl-constrained-fp"),
                             OCORE_CONSTRAINED_FP_REQUIRED="1",
                             OCORE_CONSTRAINED_FP_OUTPUT=str(evidence / "suite"),
                             OCORE_FP_REGISTER_BARRIER_REQUIRED="1",
                             OCORE_FP_REGISTER_BARRIER_OUTPUT=str(evidence / "register-barrier-suite"))
          os.environ.update(environment)
          os.environ["PATH"] = str(pathlib.Path(environment["OCORE_TEST_CLANG"]).parent) + os.pathsep + os.environ["PATH"]
          from scripts.prepare_ci_llvm_profile import required_test_report
          reports = {}
          for module, result_name in (
                  ("tests.test_ocore_native_constrained_fmul", "test-result.json"),
                  ("tests.test_ocore_native_fp_register_barrier", "register-barrier-test-result.json")):
              suite = unittest.defaultTestLoader.loadTestsFromName(module)
              discovered = suite.countTestCases()
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              unchanged = hashlib.sha256(pathlib.Path(compiler["path"]).read_bytes()).hexdigest() == compiler["sha256"]
              report = required_test_report(discovered, result, unchanged)
              report["test_module"] = module
              reports[module] = report
              (evidence / result_name).write_text(json.dumps(report, indent=2) + "\n")
          combined = {"schema": "ostadix.ci-required-scalar-fp-suites/v1", "suites": reports,
                      "passed": all(report["passed"] for report in reports.values()),
                      "foreign_ISA_native_execution": False, "whole_musl_lowering": False,
                      "cross_ISA_raw_NaN_identity": False, "FP_kernel_activation": False}
          (evidence / "required-suites-result.json").write_text(json.dumps(combined, indent=2) + "\n")
          if not combined["passed"]:
              raise SystemExit("both required scalar FP suites must each execute all9 tests with no skips and unchanged compiler")
          PYCODE
      - name: Execute required rejected-source diagnostic suite
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' 2>&1 | tee target/ocore-constrained-fp/failure-srcloc-tests.log
          # Required rejected-source diagnostic controller: distinct from scalar FP reports.
          import hashlib, json, os, pathlib, unittest
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / "target/ocore-constrained-fp"
          environment = json.loads((evidence / "setup/environment.json").read_text())
          compiler = json.loads((evidence / "compiler-pin.json").read_text())
          def digest(path):
              value = hashlib.sha256()
              with pathlib.Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()
          parser_path = environment["OCORE_TEST_LLVM_LIBRARY"]
          parser_sha256 = environment["OCORE_TEST_LLVM_SHA256"]
          if digest(parser_path) != parser_sha256 or digest(compiler["path"]) != compiler["sha256"]:
              raise SystemExit("required diagnostic parser/compiler pin mismatch before tests")
          environment.update(OCOREC_BIN=compiler["path"], OCOREC_BIN_SHA256=compiler["sha256"],
                             OCORE_LLVM_LIBRARY=parser_path, OCORE_LLVM_SHA256=parser_sha256,
                             OCORE_FAILURE_SRCLOC_REQUIRED="1",
                             OCORE_FAILURE_SRCLOC_OUTPUT=str(evidence / "failure-srcloc-suite"))
          os.environ.update(environment)
          module = "tests.test_ocore_llvm_failure_srcloc_diagnostics"
          suite = unittest.defaultTestLoader.loadTestsFromName(module)
          discovered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          compiler_unchanged = digest(compiler["path"]) == compiler["sha256"]
          parser_unchanged = digest(parser_path) == parser_sha256
          report = {"schema": "ostadix.ci-required-failure-srcloc-tests/v1", "test_module": module,
                    "discovered": discovered, "executed": result.testsRun,
                    "skipped": len(result.skipped), "errors": len(result.errors), "failures": len(result.failures),
                    "expected_failures": len(result.expectedFailures), "unexpected_successes": len(result.unexpectedSuccesses),
                    "compiler_unchanged": compiler_unchanged, "parser_unchanged": parser_unchanged,
                    "passed": result.wasSuccessful() and discovered == 13 and result.testsRun == 13
                              and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
                              and compiler_unchanged and parser_unchanged,
                    "whole_runtime_lowering": False, "new_successful_imports": False,
                    "foreign_ISA_execution": False, "ocorec_or_olangc_public_flag": False}
          (evidence / "failure-srcloc-tests-result.json").write_text(json.dumps(report, indent=2) + "\n")
          if not report["passed"]:
              raise SystemExit("all13 rejected-source diagnostic tests must execute without skips and with unchanged parser/compiler")
          PYCODE
      - name: Retain exact prerequisite and original-source execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: constrained-fp-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ocore-constrained-fp/
          if-no-files-found: error
          retention-days: 14

  boundary-contract:
    name: Hosted value/code boundary
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install declared hosted engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential nix-bin sqlite3
          python3 scripts/contract_surfaces.py probe-runtimes --suite boundary-contract
      - name: Build the actual evaluator and analyzer
        run: cargo +1.97.1 build --locked --package o-lang --bin O --bin olangc
      - name: Verify hosted value/code separation and SQL protocol
        run: |
          set -euo pipefail
          mkdir -p target/boundary-contract-logs
          cargo +1.97.1 test --locked --package o-lang --test foreign_splice_contract -- --test-threads=1 2>&1 | tee target/boundary-contract-logs/foreign-splice.log
          cargo +1.97.1 test --locked --package ostadix-api --lib -- --list > target/boundary-contract-logs/sql-test-list.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          name = "backend::tests::sqlite_file_requests_recover_from_syntax_errors_and_marker_collisions"
          lines = Path("target/boundary-contract-logs/sql-test-list.log").read_text().splitlines()
          if lines.count(name + ": test") != 1:
              raise SystemExit("required exact SQL regression is absent or duplicated")
          PY
          cargo +1.97.1 test --locked --package ostadix-api --lib backend::tests::sqlite_file_requests_recover_from_syntax_errors_and_marker_collisions -- --exact --nocapture 2>&1 | tee target/boundary-contract-logs/sql-regression.log
          python3 -m unittest -v tests.test_sql_statement_framing tests.test_reproduce_splice_contract tests.test_edition_splice_contract 2>&1 | tee target/boundary-contract-logs/python-contracts.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("target/boundary-contract-logs")
          for filename, expected in (("foreign-splice.log", 18), ("sql-regression.log", 1)):
              summaries = re.findall(r"(?m)^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;", (root / filename).read_text())
              if len(summaries) != 1 or int(summaries[0]) <= 0 or (expected is not None and int(summaries[0]) != expected):
                  raise SystemExit("missing, skipped or zero-case Rust qualification: " + filename)
          python_log = (root / "python-contracts.log").read_text()
          counts = re.findall(r"(?m)^Ran ([0-9]+) tests? in [^\n]+$", python_log)
          if len(counts) != 1 or int(counts[0]) <= 0 or python_log.rstrip().splitlines()[-1] != "OK":
              raise SystemExit("missing, skipped or zero-case Python qualification")
          PY
      - name: Retain the exact witness reproduction
        run: >-
          python3 scripts/reproduce_splice_contract.py
          --o-bin target/debug/O --backends-dir backends
          --output-dir target/splice-reproduction
      - name: Publish source-bound reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: value-code-boundary-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/splice-reproduction/
            target/boundary-contract-logs/
            tests/fixtures/foreign-splice-witnesses.json
            evidence/public-contract-20261111/
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Docker minimal runtime profile
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify declared Docker runtime
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite docker
      - name: Build and exercise minimal Docker image
        run: bash scripts/smoke-docker.sh

  rust-msrv:
    name: Rust MSRV 1.93.1
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install supported-floor toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
      - name: Check every target at the supported floor
        run: cargo +1.93.1 check --locked --workspace --all-targets --all-features
      - name: Check isolated MCP at the supported floor
        run: cargo +1.93.1 check --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml

  rust-quality:
    name: Rust quality and source closure
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy all targets and features
        run: cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build Rust API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --locked --workspace --all-features --no-deps
      - name: Verify independent engine and compatibility shell packages
        run: |
          cargo +1.97.1 package --locked --package ostadix-api
          cargo +1.97.1 package --locked --no-verify --package ostadix-api --package o-lang
      - name: Verify every declared binary target
        run: bash scripts/check_declared_bins.sh
      - name: Check parser fuzz target
        run: cargo +1.97.1 check --locked --manifest-path fuzz/Cargo.toml

  rust-tests:
    name: Rust semantic and reproducibility tests
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
      # Keep every target while limiting simultaneous links and artifact size.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - name: Install semantic-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl clang nix-bin nix-setup-systemd openssl sqlite3
          ci_nix_profile_fail() {
            sudo systemctl status --no-pager --full --lines=20 nix-daemon.socket nix-daemon.service || true
            sudo systemctl cat --no-pager nix-daemon.socket nix-daemon.service || true
            sudo journalctl -u nix-daemon.socket -u nix-daemon.service -b -n 100 --no-pager || true
            sudo ls -ld /nix/store /nix/var /nix/var/nix /nix/var/nix/daemon-socket || true
            exit 1
          }
          # The package starts the daemon directly; its listener must not race
          # a separately started systemd socket unit.
          sudo systemctl start nix-daemon.service || ci_nix_profile_fail
          ci_nix_socket=/nix/var/nix/daemon-socket/socket
          ci_nix_socket_ready=0
          for ci_nix_attempt in {1..50}; do
            if sudo test -S "$ci_nix_socket" && sudo test ! -L "$ci_nix_socket" && [[ "$(sudo stat -c %u "$ci_nix_socket")" == 0 ]]; then
              ci_nix_socket_ready=1
              break
            fi
            sleep 0.1
          done
          [[ "$ci_nix_socket_ready" == 1 ]] || ci_nix_profile_fail
          ci_nix_uid="$(id -u)"
          sudo setfacl -m "u:$ci_nix_uid:--x" /nix/var/nix/daemon-socket || ci_nix_profile_fail
          sudo setfacl -m "u:$ci_nix_uid:rw-" "$ci_nix_socket" || ci_nix_profile_fail
          sudo getfacl --absolute-names /nix/var/nix/daemon-socket "$ci_nix_socket"
      - name: Verify declared runtime prerequisites
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite rust-tests
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tests-compact-${{ hashFiles('Cargo.lock') }}
      - name: Prepare the pinned original Nix examples and local daemon
        run: >-
          python3 scripts/prepare_ci_nix_profile.py
          --work-dir "$RUNNER_TEMP/ostadix-nix-example-profile"
          --report target/ci-tool-pins/nix-example-profile.json
          --github-env "$GITHUB_ENV"
      - name: Pin the actual Python tool for provider-order tests
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          executable = Path(sys.executable).resolve(strict=True)
          raw = executable.read_bytes()
          sha256 = hashlib.sha256(raw).hexdigest()
          report = {"schema": "ostadix.ci-python-tool-pin/v1",
                    "executable": str(executable), "bytes": len(raw),
                    "sha256": sha256, "version": sys.version}
          destination = Path("target/ci-tool-pins/provider-order-python.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write("OCORE_ORDER_TEST_PYTHON=" + str(executable) + "\n")
              stream.write("OCORE_ORDER_TEST_PYTHON_SHA256=" + sha256 + "\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Record runner build resources
        run: |
          df -h .
          free -h
      - name: Run broad Rust test suite
        run: cargo +1.97.1 test --locked --workspace --all-targets --all-features --no-fail-fast
      - name: Run deterministic parser properties
        run: cargo +1.97.1 test --locked --package o-lang --test parser_proptest
      - name: Verify byte-reproducible O-core objects
        run: cargo +1.97.1 test --locked --package ostadix-api --lib ocore::driver::tests::ocore_object_is_byte_reproducible_across_source_directories -- --exact
      - name: Run manifest-selected Rust example semantics
        run: O_BIN="$PWD/target/debug/O" ./test_o_lang_examples.sh
      - name: Check every tracked O and O-core source and packaged mirror
        run: python3 scripts/check_language_sources.py check --o-bin "$PWD/target/debug/O" --ocorec "$PWD/target/debug/ocorec"
      - name: Verify native command forwarding and installation compatibility
        run: O_LANG_NATIVE_CLI_BIN="$PWD/target/debug/o-cli" python3 -m unittest -v tests.test_o_cli_dispatch
      - name: Verify parse-only source metadata used by assistant code execution
        run: O_SOURCE_STRUCTURE_TEST_BIN="$PWD/target/debug/O" python3 -m unittest -v tests.test_source_structure
      - name: Prove the browser WASI host and a real Olang bundle
        run: |
          node apps/olang-browser-wasi/test-host.mjs
          cargo +1.97.1 run --locked --bin olangc -- \
            examples/wasm_hello.O --target wasm \
            --browser-bundle "$RUNNER_TEMP/olang-browser-bundle"
          node apps/olang-browser-wasi/test-bundle.mjs \
            "$RUNNER_TEMP/olang-browser-bundle" \
            "OSTADIX OLANGC WASM EXECUTION PASS"
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser_bin" ]]; then
            echo "::error::Browser qualification requires preinstalled Google Chrome or Chromium"
            exit 1
          fi
          CHROME_BIN="$browser_bin" node apps/olang-browser-wasi/test-browser.mjs \
            "$RUNNER_TEMP/olang-browser-bundle" \
            "OSTADIX OLANGC WASM EXECUTION PASS"
      - name: Retain the actual runtime tool pins and Nix profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests-tool-pins-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/ci-tool-pins/provider-order-python.json
            target/ci-tool-pins/nix-example-profile.json
          if-no-files-found: warn
          retention-days: 14

  rust-hosted:
    name: Rust hosted lifecycle and placement
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install hosted prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils clang iproute2 openssl sqlite3
      - name: Verify declared hosted runtimes
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite rust-hosted
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hosted-compact-${{ hashFiles('Cargo.lock') }}
      - name: Record runner build resources
        run: |
          df -h .
          free -h
      - name: Build hosted targets
        run: |
          cargo +1.97.1 build --locked --workspace --all-targets --all-features
          cargo +1.97.1 build --release --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml
      - name: Prove immutable rootfs execution and namespace lifecycle
        timeout-minutes: 10
        env:
          OSTADIX_ROOTFS_TEST_SUDO: "1"
        run: cargo +1.97.1 test --locked --package o-lang --all-features --test linux_runtime_rootfs one_binary_runs_python_bash_and_multicall_inside_immutable_private_root -- --ignored --exact --nocapture --test-threads=1
      - name: Prove zero-config non-loopback LAN path
        timeout-minutes: 2
        run: bash scripts/smoke-zero-config-lan-netns.sh
      - name: Run fast autonomous worker lifecycle gates
        timeout-minutes: 3
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/autonomous-workers.log
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/ostadix-lifecycle"
          for test_name in \
            ordinary_ephemeral_python_preserves_strict_fail_stop \
            explicit_one_worker_override_serializes_autonomous_blocks \
            explicit_autonomous_ephemeral_python_blocks_overlap \
            autonomous_worker_pool_refills_24_tasks_without_exceeding_capacity \
            autonomous_worker_o_eval_sees_lexical_scope \
            autonomous_worker_o_eval_failure_terminates_backend \
            autonomous_worker_nested_hosted_callback_inherits_deadline \
            autonomous_nonresponsive_backend_fails_within_configured_bound
          do
            cargo +1.97.1 test --locked --package o-lang --test autonomous_hosted_parallel "$test_name" -- --exact --nocapture --test-threads=1
          done
      - name: Prove descendant quiescence
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-descendant.log
        run: cargo +1.97.1 test --locked --package o-lang --test autonomous_hosted_parallel autonomous_lingering_same_group_descendant_fails_and_group_becomes_quiescent -- --exact --nocapture --test-threads=1
      - name: Run production backend-proxy lifecycle gate
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-proxy.log
        run: cargo +1.97.1 test --locked --package o-lang --test autonomous_hosted_parallel production_python_backend_proxy_shutdown_reaps_shim -- --exact --nocapture --test-threads=1
      - name: Run hosted transport and session tests
        env:
          OSTADIX_MCP_TEST_BIN: ${{ github.workspace }}/mcp/ostadix_lang_mcp_server/target/release/ostadix-mcp
        run: |
          cargo +1.97.1 test --locked --package o-lang --test hosted_remote_cli
          cargo +1.97.1 test --locked --package o-lang --test project_mesh_cli -- --test-threads=1
          cargo +1.97.1 test --locked --package o-lang --test hosted_remote_v2
          cargo +1.97.1 test --locked --package o-lang --test placement_v6
          cargo +1.97.1 test --locked --package o-lang --test registry_v1
      - name: Prove authenticated two-o-node Fabric boundary
        timeout-minutes: 3
        run: bash scripts/smoke-execution-fabric-v1.sh
      - name: Run hosted semantic smokes
        run: |
          O_RELEASE_BIN="$PWD/target/debug/O" OLANGC_RELEASE_BIN="$PWD/target/debug/olangc" \
            scripts/benchmark_hgraph_hosted.sh --warmups 0 --repetitions 1 --sleep 0 --workers 4 --missing-runtime fail
          bash scripts/smoke-hosted-live-reference.sh
          bash scripts/smoke-world-resource-keys.sh
          bash scripts/smoke-project-hgraph.sh
          bash scripts/smoke-project-hgraph-exec.sh
      - name: Upload hosted lifecycle traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-lifecycle-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ostadix-lifecycle
          if-no-files-found: warn
          retention-days: 14

