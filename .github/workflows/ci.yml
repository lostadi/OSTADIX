          def read_verified_source(name, record):
              fd=os.open(record["path"],os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  before=os.fstat(fd)
                  chunks=[]
                  while True:
                      part=os.read(fd,1048576)
                      if not part: break
                      chunks.append(part)
                  raw=b"".join(chunks)
                  after=os.fstat(fd)
