name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Contract surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require Lee-only publication attribution
        env:
          ATTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ATTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/check_attribution.py
          --base "$ATTRIBUTION_BASE"
          --head "$ATTRIBUTION_HEAD"
          --ref-type "${{ github.ref_type || 'branch' }}"
      - name: Validate authoritative contract projections
        run: |
          python3 scripts/local_ci_posture.py --profile baseline --format text
          python3 scripts/contract_surfaces.py validate
          python3 scripts/check_architecture_boundaries.py
          python3 -m unittest -v tests.test_contract_surfaces tests.test_local_ci_posture tests.test_attribution_policy tests.test_architecture_boundaries tests.test_governance_surfaces

  docker:
    name: Docker minimal runtime profile
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify declared Docker runtime
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite docker
      - name: Build and exercise minimal Docker image
        run: bash scripts/smoke-docker.sh

  rust-msrv:
    name: Rust MSRV 1.93.1
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install supported-floor toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
      - name: Check every target at the supported floor
        run: cargo +1.93.1 check --locked --workspace --all-targets --all-features
      - name: Check isolated MCP at the supported floor
        run: cargo +1.93.1 check --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml

  rust-quality:
    name: Rust quality and source closure
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy all targets and features
        run: cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build Rust API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --locked --workspace --all-features --no-deps
      - name: Verify independent engine and compatibility shell packages
        run: |
          cargo +1.97.1 package --locked --package ostadix-api
          cargo +1.97.1 package --locked --no-verify --package ostadix-api --package o-lang
      - name: Verify every declared binary target
        run: bash scripts/check_declared_bins.sh
      - name: Check parser fuzz target
        run: cargo +1.97.1 check --locked --manifest-path fuzz/Cargo.toml

  rust-tests:
    name: Rust semantic and reproducibility tests
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
      # Keep every target while limiting simultaneous links and artifact size.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - name: Install semantic-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang openssl sqlite3
      - name: Verify declared runtime prerequisites
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite rust-tests
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tests-compact-${{ hashFiles('Cargo.lock') }}
      - name: Record runner build resources
        run: |
          df -h .
          free -h
      - name: Run broad Rust test suite
        run: cargo +1.97.1 test --locked --workspace --all-targets --all-features --no-fail-fast
      - name: Run deterministic parser properties
        run: cargo +1.97.1 test --locked --package o-lang --test parser_proptest
      - name: Verify byte-reproducible O-core objects
        run: cargo +1.97.1 test --locked --package ostadix-api --lib ocore::driver::tests::ocore_object_is_byte_reproducible_across_source_directories -- --exact
      - name: Run manifest-selected Rust example semantics
        run: O_BIN="$PWD/target/debug/O" ./test_o_lang_examples.sh
      - name: Check every tracked O and O-core source and packaged mirror
        run: python3 scripts/check_language_sources.py check --o-bin "$PWD/target/debug/O" --ocorec "$PWD/target/debug/ocorec"
      - name: Verify native command forwarding and installation compatibility
        run: O_LANG_NATIVE_CLI_BIN="$PWD/target/debug/o-cli" python3 -m unittest -v tests.test_o_cli_dispatch
      - name: Verify parse-only source metadata used by assistant code execution
        run: O_SOURCE_STRUCTURE_TEST_BIN="$PWD/target/debug/O" python3 -m unittest -v tests.test_source_structure
      - name: Prove the browser WASI host and a real Olang bundle
        run: |
          node apps/olang-browser-wasi/test-host.mjs
          cargo +1.97.1 run --locked --bin olangc -- \
            examples/wasm_hello.O --target wasm \
            --browser-bundle "$RUNNER_TEMP/olang-browser-bundle"
          node apps/olang-browser-wasi/test-bundle.mjs \
            "$RUNNER_TEMP/olang-browser-bundle" \
            "OSTADIX OLANGC WASM EXECUTION PASS"
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser_bin" ]]; then
            echo "::error::Browser qualification requires preinstalled Google Chrome or Chromium"
            exit 1
          fi
          CHROME_BIN="$browser_bin" node apps/olang-browser-wasi/test-browser.mjs \
            "$RUNNER_TEMP/olang-browser-bundle" \
            "OSTADIX OLANGC WASM EXECUTION PASS"

  rust-hosted:
    name: Rust hosted lifecycle and placement
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install hosted prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils clang iproute2 openssl sqlite3
      - name: Verify declared hosted runtimes
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite rust-hosted
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hosted-compact-${{ hashFiles('Cargo.lock') }}
      - name: Record runner build resources
        run: |
          df -h .
          free -h
      - name: Build hosted targets
        run: |
          cargo +1.97.1 build --locked --workspace --all-targets --all-features
          cargo +1.97.1 build --release --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml
      - name: Prove immutable rootfs execution and namespace lifecycle
        timeout-minutes: 10
        env:
          OSTADIX_ROOTFS_TEST_SUDO: "1"
        run: cargo +1.97.1 test --locked --package o-lang --all-features --test linux_runtime_rootfs one_binary_runs_python_bash_and_multicall_inside_immutable_private_root -- --ignored --exact --nocapture --test-threads=1
      - name: Prove zero-config non-loopback LAN path
        timeout-minutes: 2
        run: bash scripts/smoke-zero-config-lan-netns.sh
      - name: Run fast autonomous worker lifecycle gates
        timeout-minutes: 3
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/autonomous-workers.log
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/ostadix-lifecycle"
          for test_name in \
            ordinary_ephemeral_python_preserves_strict_fail_stop \
            explicit_one_worker_override_serializes_autonomous_blocks \
            explicit_autonomous_ephemeral_python_blocks_overlap \
            autonomous_worker_pool_refills_24_tasks_without_exceeding_capacity \
            autonomous_worker_o_eval_sees_lexical_scope \
            autonomous_worker_o_eval_failure_terminates_backend \
            autonomous_worker_nested_hosted_callback_inherits_deadline \
            autonomous_nonresponsive_backend_fails_within_configured_bound
          do
            cargo +1.97.1 test --locked --package o-lang --test autonomous_hosted_parallel "$test_name" -- --exact --nocapture --test-threads=1
          done
      - name: Prove descendant quiescence
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-descendant.log
        run: cargo +1.97.1 test --locked --package o-lang --test autonomous_hosted_parallel autonomous_lingering_same_group_descendant_fails_and_group_becomes_quiescent -- --exact --nocapture --test-threads=1
      - name: Run production backend-proxy lifecycle gate
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-proxy.log
        run: cargo +1.97.1 test --locked --package o-lang --test autonomous_hosted_parallel production_python_backend_proxy_shutdown_reaps_shim -- --exact --nocapture --test-threads=1
      - name: Run hosted transport and session tests
        env:
          OSTADIX_MCP_TEST_BIN: ${{ github.workspace }}/mcp/ostadix_lang_mcp_server/target/release/ostadix-mcp
        run: |
          cargo +1.97.1 test --locked --package o-lang --test hosted_remote_cli
          cargo +1.97.1 test --locked --package o-lang --test project_mesh_cli -- --test-threads=1
          cargo +1.97.1 test --locked --package o-lang --test hosted_remote_v2
          cargo +1.97.1 test --locked --package o-lang --test placement_v6
          cargo +1.97.1 test --locked --package o-lang --test registry_v1
      - name: Prove authenticated two-o-node Fabric boundary
        timeout-minutes: 3
        run: bash scripts/smoke-execution-fabric-v1.sh
      - name: Run hosted semantic smokes
        run: |
          O_RELEASE_BIN="$PWD/target/debug/O" OLANGC_RELEASE_BIN="$PWD/target/debug/olangc" \
            scripts/benchmark_hgraph_hosted.sh --warmups 0 --repetitions 1 --sleep 0 --workers 4 --missing-runtime fail
          bash scripts/smoke-hosted-live-reference.sh
          bash scripts/smoke-world-resource-keys.sh
          bash scripts/smoke-project-hgraph.sh
          bash scripts/smoke-project-hgraph-exec.sh
      - name: Upload hosted lifecycle traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-lifecycle-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ostadix-lifecycle
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Python reference runtime
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Python contracts and reference runtime
        run: |
          python3 -m tests.test_parser
          python3 tests/example_manifest.py validate
          python3 scripts/check_language_sources.py validate
          python3 scripts/render_docs.py validate
          python3 -m unittest -v tests.test_example_manifest tests.test_benchmark_hgraph_hosted
          python3 -m unittest -v tests.test_foreign_kernel_lab tests.test_ostadix_capacity tests.test_ostadix_capacity_iso tests.test_ostadix_boot_media tests.test_ostadix_boot_iso tests.test_ostadix_boot_info_qemu tests.test_ostadix_hosted_live_release tests.test_ostadix_ventoy_installer tests.test_ostadix_media_writer tests.test_ostadix_physical_evidence tests.test_setup tests.test_native_install tests.test_language_sources tests.test_render_docs
          python3 -m tests.test_evaluator
          python3 -B tests/test_backend_state_protocol.py -v
          python3 -B tests/test_bundled_shim_protocol.py -v
          python3 -m unittest -v tests.test_python_native_handles tests.test_morphism_enforcement_protocol tests.test_runtime_rootfs_collection
          python3 -m unittest -v tests.test_appfunction_host tests.test_appfunction_host_disconnect tests.test_assistant_service tests.test_assistant_permissions tests.test_python_diagnostics
          python3 -m compileall -q o_lang backends tests
      - name: Verify all generated HTML exports
        run: |
          npm install --prefix "$RUNNER_TEMP/ostadix-doc-tools" --no-audit --no-fund --ignore-scripts marked@18.0.13
          python3 scripts/render_docs.py check --marked "$RUNNER_TEMP/ostadix-doc-tools/node_modules/.bin/marked"

  c17:
    name: C17 runtime and AOT compiler
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test C17 editions
        run: |
          make -C c_cpp clean
          make -C c_cpp
          make -C c_cpp test
          make -C c_cpp olangc-test
          make -C c_cpp warnings-as-errors
          cmake -S c_cpp -B "${{ runner.temp }}/olang-cmake-build" -DCMAKE_BUILD_TYPE=Release -DOLANG_WARNINGS_AS_ERRORS=ON
          cmake --build "${{ runner.temp }}/olang-cmake-build" --parallel
          ctest --test-dir "${{ runner.temp }}/olang-cmake-build" --output-on-failure

  mcp:
    name: Ostadix MCP release surface
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Build and validate MCP
        run: |
          cargo +1.97.1 build --release --locked --package o-lang --bin O --bin o-cli --bin olangc --bin o-info --bin o-link --bin o-node --bin octl
          cargo +1.97.1 test --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml
          python3 -m unittest -v tests.test_mcp_smoke tests.test_mcp_client tests.test_configure_gemini_mcp
          cargo +1.97.1 clippy --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml -- -D warnings
          cargo +1.97.1 build --release --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml
          python3 scripts/smoke_ostadix_mcp.py
          python3 scripts/smoke_ostadix_mcp_http.py
          python3 -m unittest -v tests.test_mcp_http_updater
          python3 scripts/smoke_ostadix_mcp_node.py

  release-claims:
    name: Release-claim guard
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release evidence and source archive
        run: |
          bash scripts/check_release_claims.sh
          python3 -m unittest -v tests.test_world_alpha_evidence
          python3 -m unittest -v tests.test_release_evidence
          python3 -m unittest -v tests.test_offline_kit tests.test_olang_browser_bundle
          python3 -m unittest -v tests.test_source_release
          python3 scripts/build_source_release.py --output "$RUNNER_TEMP/Ostadix-lang-source.zip"
          python3 scripts/build_source_release.py --verify "$RUNNER_TEMP/Ostadix-lang-source.zip"

  offline-kit-linux-x64:
    name: Offline kit recipient (Linux x86_64)
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install builder Python 3.11
        id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install recipient-floor Python 3.10
        id: python310
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Build, verify, and extract a sealed native-host fixture
        run: |
          "${{ steps.python311.outputs.python-path }}" tests/qualify_offline_kit_recipient.py \
            --recipient-python "${{ steps.python310.outputs.python-path }}" \
            --expected-host x86_64-unknown-linux-gnu \
            --work-root "$RUNNER_TEMP/offline-recipient-qualification"

  offline-kit-linux-arm64:
    name: Offline kit recipient (Linux aarch64)
    needs: contracts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install builder Python 3.11
        id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install recipient-floor Python 3.10
        id: python310
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Build, verify, and extract a sealed native-host fixture
        run: |
          "${{ steps.python311.outputs.python-path }}" tests/qualify_offline_kit_recipient.py \
            --recipient-python "${{ steps.python310.outputs.python-path }}" \
            --expected-host aarch64-unknown-linux-gnu \
            --work-root "$RUNNER_TEMP/offline-recipient-qualification"

  offline-kit-macos-x64:
    name: Offline kit recipient (macOS x86_64)
    needs: contracts
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install builder Python 3.11
        id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install recipient-floor Python 3.10
        id: python310
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Build, verify, and extract a sealed native-host fixture
        run: |
          "${{ steps.python311.outputs.python-path }}" tests/qualify_offline_kit_recipient.py \
            --recipient-python "${{ steps.python310.outputs.python-path }}" \
            --expected-host x86_64-apple-darwin \
            --work-root "$RUNNER_TEMP/offline-recipient-qualification"

  offline-kit-macos-arm64:
    name: Offline kit recipient (macOS aarch64)
    needs: contracts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install builder Python 3.11
        id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install recipient-floor Python 3.10
        id: python310
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Build, verify, and extract a sealed native-host fixture
        run: |
          "${{ steps.python311.outputs.python-path }}" tests/qualify_offline_kit_recipient.py \
            --recipient-python "${{ steps.python310.outputs.python-path }}" \
            --expected-host aarch64-apple-darwin \
            --work-root "$RUNNER_TEMP/offline-recipient-qualification"

  offline-kit:
    name: Offline kit recipient matrix
    if: ${{ always() }}
    needs:
      - offline-kit-linux-arm64
      - offline-kit-linux-x64
      - offline-kit-macos-arm64
      - offline-kit-macos-x64
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported native-host recipient lane
        env:
          LINUX_ARM64: ${{ needs.offline-kit-linux-arm64.result }}
          LINUX_X64: ${{ needs.offline-kit-linux-x64.result }}
          MACOS_ARM64: ${{ needs.offline-kit-macos-arm64.result }}
          MACOS_X64: ${{ needs.offline-kit-macos-x64.result }}
        run: |
          status=0
          for name in LINUX_ARM64 LINUX_X64 MACOS_ARM64 MACOS_X64; do
            result="${!name}"
            printf '%s=%s\n' "$name" "$result"
            [[ "$result" == success ]] || status=1
          done
          exit "$status"

  ocore-qemu:
    name: O-core QEMU proof
    needs: contracts
    runs-on: ubuntu-26.04
    # The complete import/capture and cross-ISA proof suite outgrew the former
    # 15-minute limit; keep every proof rather than timing out during progress.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu, riscv64imac-unknown-none-elf
      - name: Install freestanding build, ELF inspection, and QEMU tools
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -qF packages.microsoft.com "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm binutils qemu-user qemu-system-x86 qemu-system-arm qemu-system-riscv opensbi default-jdk-headless grub-efi-amd64-bin mtools ovmf xorriso
          qemu-system-x86_64 --version
      - name: Build the O-core compiler for native equivalence
        run: cargo build --locked --bin ocorec --bin olangc
      - name: Verify imported IR contracts and complete capture inventories
        env:
