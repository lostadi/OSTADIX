    name: Offline kit recipient matrix
    if: ${{ always() }}
    needs:
      - offline-kit-linux-arm64
      - offline-kit-linux-x64
      - offline-kit-macos-arm64
      - offline-kit-macos-x64
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported native-host recipient lane
        env:
          LINUX_ARM64: ${{ needs.offline-kit-linux-arm64.result }}
          LINUX_X64: ${{ needs.offline-kit-linux-x64.result }}
          MACOS_ARM64: ${{ needs.offline-kit-macos-arm64.result }}
          MACOS_X64: ${{ needs.offline-kit-macos-x64.result }}
        run: |
          status=0
          for name in LINUX_ARM64 LINUX_X64 MACOS_ARM64 MACOS_X64; do
            result="${!name}"
            printf '%s=%s\n' "$name" "$result"
            [[ "$result" == success ]] || status=1
          done
          exit "$status"

  native-leaf-targets:
    name: Native leaf graph on ${{ matrix.target }}
    needs: contracts
    # Ubuntu 24.04 supplies the PRoot 5.1 / QEMU 8.2 pair used for
    # nested exec of the sealed leaf and host assembler/linker.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            cross: aarch64-linux-gnu
            isa: aarch64
            libc: libc6-dev-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            cross: riscv64-linux-gnu
            isa: riscv64
            libc: libc6-dev-riscv64-cross
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install cross compiler and Linux user-mode emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang proot qemu-user gcc-${{ matrix.cross }} ${{ matrix.libc }}
      - name: Check target runner prerequisites
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite native-leaf-targets
      - name: Run the target-built graph executor and its sealed child executables
        env:
          RUST_TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
          ISA: ${{ matrix.isa }}
        run: |
          cargo_key=${RUST_TARGET^^}
          cargo_key=${cargo_key//-/_}
          export "CARGO_TARGET_${cargo_key}_LINKER=$CROSS-gcc"
          export "CARGO_TARGET_${cargo_key}_RUNNER=proot -q /usr/bin/qemu-$ISA"
          export QEMU_LD_PREFIX="/usr/$CROSS" O_NATIVE_CLANG=/usr/bin/clang O_NATIVE_LD="/usr/bin/$CROSS-ld"
          # The target checkpoint test pins the host Python executable. Give PRoot
          # a regular file so resolving python3 does not cross into the guest sysroot.
          install -D -m 0755 /usr/bin/python3 "$RUNNER_TEMP/native-leaf-host-bin/python3"
          export PATH="$RUNNER_TEMP/native-leaf-host-bin:$PATH"
          set -o pipefail
          cases=(
            executable_preorder_binds_source_spans_and_plan_ids_across_node_forms
            source_plan_materialized_values_match_their_oir_literals
            replacement_actor_requires_the_complete_restore_receipt_before_publication
            checkpoint_capture_and_restore_require_the_admitted_backend_and_runtime
            parsed_instruction_lowering_requires_the_selected_isa_layout_before_emitting_state
            native_leaf_runs_owned_sealed_code_with_stack_arguments_and_trap_failure
            sealed_leaf_elf_matches_the_frontend_abi_and_rejects_mismatched_headers
          )
          cargo test --locked --target "$RUST_TARGET" -p ostadix-api --lib -- \
            --test-threads=1 native_leaf_graph_tests "${cases[@]}" | tee "$RUNNER_TEMP/leaf-tests.log"
          for case_name in "${cases[@]}" native_leaf_graph_store_chain_publishes_real_resource_successors native_leaf_graph_trap_blocks_store_value_completion_and_resource_outputs; do
            grep -F "::$case_name ... ok" "$RUNNER_TEMP/leaf-tests.log"
          done

  ocore-qemu:
    name: O-core QEMU proof
    needs: contracts
    runs-on: ubuntu-26.04
    # The complete import/capture and cross-ISA proof suite outgrew the former
    # 15-minute limit; keep every proof rather than timing out during progress.
    timeout-minutes: 60
    env:
      # Explicit dev/test Cargo debug-info profile for this QEMU job only.
      # Preserve every proof command and its native/emulator options.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu, riscv64imac-unknown-none-elf
      - name: Install freestanding build, ELF inspection, and QEMU tools
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -qF packages.microsoft.com "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm binutils qemu-user qemu-system-x86 qemu-system-arm qemu-system-riscv opensbi default-jdk-headless grub-efi-amd64-bin mtools ovmf xorriso dpkg-dev
          qemu-system-x86_64 --version
      - name: Verify declared O-core prerequisites
        run: python3 scripts/contract_surfaces.py probe-runtimes --suite ocore-qemu
      - name: Pin the actual Python tool for provider-order tests
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          executable = Path(sys.executable).resolve(strict=True)
          raw = executable.read_bytes()
          sha256 = hashlib.sha256(raw).hexdigest()
          report = {"schema": "ostadix.ci-python-tool-pin/v1",
                    "executable": str(executable), "bytes": len(raw),
                    "sha256": sha256, "version": sys.version}
          destination = Path("target/ci-tool-pins/provider-order-python.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write("OCORE_ORDER_TEST_PYTHON=" + str(executable) + "\n")
              stream.write("OCORE_ORDER_TEST_PYTHON_SHA256=" + sha256 + "\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Build the O-core compiler for native equivalence
        run: cargo build --locked --bin ocorec --bin olangc
      - name: Verify native evidence freshness and artifact maps
        run: |
          python3 -m unittest discover -s tests -p test_ocore_native_equivalence.py -v
